<style>
  :root{
    --bg:#0B0F14; --panel:#141B24; --panel2:#1B2431; --panel3:#212C3B;
    --line:#273241; --line2:#31404F;
    --ink:#E9EEF4; --muted:#8B98AA; --muted2:#5C6A7C;
    --acc:#38BDF8; --acc-ink:#04121A;
    --ok:#3ED598; --warn:#FDBB4B;
    --r:14px; --r2:10px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  button{font-family:inherit;color:inherit;cursor:pointer}
  input{font-family:var(--mono)}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(11,15,20,.96),rgba(11,15,20,.82));
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .top{display:flex;align-items:center;gap:12px;height:56px}
  .brand{font-weight:800;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
  .brand b{color:var(--acc)}
  .ctx{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);
    display:flex;gap:8px;align-items:center;text-transform:uppercase;letter-spacing:.04em}
  .ctx .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2)}
  h1{font-size:26px;letter-spacing:-.01em;margin:.15em 0 .1em;font-weight:800}
  .sub{color:var(--muted);font-size:13px;line-height:1.5}

  .spine{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .per{position:relative;display:flex;align-items:stretch;gap:14px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;overflow:hidden;
    transition:transform .12s ease,border-color .12s ease}
  .per:active{transform:scale(.992)}
  .per .rail{width:4px;border-radius:4px;background:var(--pc)}
  .per .bars{width:44px;display:flex;align-items:flex-end;gap:3px;opacity:.9}
  .per .bars i{flex:1;border-radius:2px 2px 0 0;background:var(--pc);display:block}
  .per .meta{flex:1;min-width:0}
  .per .pname{font-weight:800;font-size:16px;letter-spacing:.01em}
  .per .pphase{color:var(--pc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .per .pdates{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
  .per .pgo{align-self:center;color:var(--muted2);font-size:20px}
  .per[data-current="1"]{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset,0 8px 30px -18px var(--pc)}
  .tagcur{position:absolute;top:0;right:0;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
    background:var(--pc);color:#04121A;padding:3px 8px;border-bottom-left-radius:8px;font-weight:700}

  .weeks{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap}
  .pip{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;border:1px solid var(--line2);
    background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:600;transition:all .12s ease}
  .pip[data-on="1"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:800}

  .days{display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .day{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r);padding:13px 14px;transition:transform .12s ease}
  .day:active{transform:scale(.992)}
  .day .dow{font-family:var(--mono);font-size:11px;color:var(--muted2);width:30px;text-transform:uppercase;letter-spacing:.06em}
  .day .dbody{flex:1;min-width:0}
  .day .dname{font-weight:700;font-size:15px}
  .day .dtype{color:var(--muted);font-size:12px;margin-top:2px}
  .day .dchip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--muted)}
  .day.off{opacity:.5}
  .day.off .dname{font-weight:600;color:var(--muted)}
  .kindLift{--k:var(--acc)} .kindCond{--k:#8B5CF6} .kindCardio{--k:#3ED598} .kindField{--k:#FDBB4B}
  .day .kbar{width:3px;align-self:stretch;border-radius:3px;background:var(--k,var(--acc))}
  .dprog{width:26px;height:26px;position:relative;flex:none}
  .ring{transform:rotate(-90deg)} .ring .bg{stroke:var(--line2)} .ring .fg{stroke:var(--acc);transition:stroke-dashoffset .3s ease}

  .backrow{display:flex;align-items:center;gap:10px;margin:14px 0 2px}
  .back{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);
    background:var(--panel);border-radius:999px;padding:7px 13px}
  .dayhead{margin:6px 0 2px}
  .dayhead .focus{color:var(--acc);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.09em}

  details.prep{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;overflow:hidden}
  details.prep>summary{list-style:none;cursor:pointer;padding:14px 15px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}
  details.prep>summary::-webkit-details-marker{display:none}
  details.prep>summary .tw{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);transition:transform .2s}
  details.prep[open]>summary .tw{transform:rotate(90deg)}
  .prep .pbody{padding:2px 15px 14px;border-top:1px solid var(--line)}
  .prow{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.45}
  .prow:last-child{border-bottom:0}
  .prow .pl{flex:1;color:var(--ink)} .prow .pv{font-family:var(--mono);font-size:12px;color:var(--acc);white-space:nowrap;align-self:center}
  .note-lite{color:var(--muted);font-size:12.5px;font-style:italic;margin-top:10px;line-height:1.5}

  .ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;overflow:hidden}
  .ex .xh{display:flex;gap:12px;padding:14px 15px 12px;align-items:flex-start}
  .badge{width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--acc-ink);font-weight:800;
    display:grid;place-items:center;font-size:13px;flex:none;font-family:var(--mono)}
  .badge.alt{background:transparent;color:var(--acc);border:1px solid var(--acc)}
  .badge.jump{background:transparent;color:var(--warn);border:1px solid var(--warn)}
  .xh .xt{flex:1;min-width:0}
  .xname{font-weight:800;font-size:16px;letter-spacing:-.005em;line-height:1.25}
  .xnote{color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:5px}

  .rx{display:flex;gap:8px;flex-wrap:wrap;padding:0 15px 12px}
  .rxcell{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:8px 11px;min-width:64px}
  .rxcell .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}
  .rxcell .v{font-family:var(--mono);font-size:16px;font-weight:700;margin-top:2px}
  .rxcell.big{flex:1} .rxcell.big .v{color:var(--acc);font-size:15px}
  .rest-btn{margin-left:auto;display:flex;align-items:center;gap:7px;align-self:stretch;
    background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r2);padding:0 13px;font-family:var(--mono);
    font-size:12px;color:var(--ink)}
  .rest-btn b{color:var(--acc)}
  .xc{font-family:var(--mono);font-size:11px;color:var(--muted2);padding:0 15px 11px;margin-top:-2px}
  .xc b{color:var(--warn)}

  .sets{border-top:1px solid var(--line);padding:6px 8px 10px}
  .setrow{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:8px;align-items:center;padding:5px 7px;border-radius:10px}
  .setrow.metric{grid-template-columns:34px 1fr 40px}
  .setrow.head{padding-top:8px;padding-bottom:2px}
  .setrow.head span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);text-align:center}
  .setrow.head .sh-lbl{text-align:left;padding-left:4px}
  .setno{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:700;text-align:center}
  .setrow input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    color:var(--ink);font-size:15px;padding:9px 6px;text-align:center;outline:none}
  .setrow input::placeholder{color:var(--muted2)}
  .setrow input:focus{border-color:var(--acc);background:#0e1620}
  .setrow.done input{border-color:transparent;background:rgba(62,213,152,.09);color:var(--ok)}
  .chk{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);
    display:grid;place-items:center;color:var(--muted2);font-size:15px;justify-self:center}
  .setrow.done .chk{background:var(--ok);color:#04140C;border-color:var(--ok)}
  .lastwk{grid-column:2 / 4;font-family:var(--mono);font-size:10.5px;color:var(--muted2);padding:0 4px 3px;letter-spacing:.02em}
  .lastwk b{color:var(--muted)}
  .addset{margin:2px 7px 4px;width:calc(100% - 14px);background:transparent;border:1px dashed var(--line2);
    color:var(--muted);border-radius:9px;padding:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em}

  .circuit{border-top:1px solid var(--line);padding:12px 15px}
  .citem{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.4}
  .citem:last-child{border-bottom:0} .citem .cn{font-family:var(--mono);color:var(--acc);font-size:12px;flex:none}
  .rounds{display:flex;align-items:center;gap:12px;margin-top:12px;font-family:var(--mono);font-size:13px;color:var(--muted)}
  .stepper{display:flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
  .stepper button{width:38px;height:36px;background:var(--panel2);border:0;font-size:18px;color:var(--ink)}
  .stepper .val{width:40px;text-align:center;font-family:var(--mono);font-weight:700;font-size:15px}

  .cond{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;overflow:hidden}
  .cond .ch{padding:14px 15px 6px}
  .cond .ct{font-weight:800;font-size:16px} .cond .cs{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.45}
  .interval-btn{margin:10px 15px 4px;display:flex;align-items:center;justify-content:center;gap:9px;
    background:var(--panel2);border:1px solid var(--acc);color:var(--acc);border-radius:11px;padding:12px;
    font-weight:700;font-size:14px;width:calc(100% - 30px)}
  .series-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    margin:12px 15px 2px;display:flex;gap:8px;align-items:center}
  .series-h .o{color:var(--warn)}
  .reps{padding:2px 12px 14px}
  .rep{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px;margin:8px 0}
  .rep .rhd{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .rep .rl{font-weight:700;font-size:14px} .rep .rl small{color:var(--muted);font-weight:600;font-family:var(--mono);font-size:11px;margin-left:6px}
  .rep .rt{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--warn)}
  .rep .rtimer{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--acc);border:1px solid var(--line2);border-radius:999px;padding:5px 11px;background:var(--panel)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2)}
  .fld input{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px;font-size:14px;text-align:center;outline:none}
  .fld input:focus{border-color:var(--acc)}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(13,18,25,.94);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .navin{max-width:640px;margin:0 auto;display:flex}
  .navbtn{flex:1;background:transparent;border:0;padding:11px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted2)}
  .navbtn .ni{font-size:19px;line-height:1} .navbtn .nl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
  .navbtn[data-on="1"]{color:var(--acc)}

  .scrim{position:fixed;inset:0;z-index:60;background:rgba(6,9,13,.72);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
  .scrim[data-open="1"]{display:flex}
  .sheet{width:100%;max-width:640px;background:var(--panel);border:1px solid var(--line2);border-radius:22px 22px 0 0;
    padding:20px 18px calc(26px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px -20px #000}
  .sheet h3{margin:0 0 2px;font-size:14px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .clock{display:grid;place-items:center;margin:10px 0 6px}
  .clock svg{transform:rotate(-90deg)}
  .clock .rbg{stroke:var(--line2)} .clock .rfg{stroke:var(--acc);transition:stroke-dashoffset .95s linear}
  .clock .time{position:absolute;font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:.02em}
  .clock .phase{position:absolute;margin-top:78px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tctrls{display:flex;gap:10px;margin-top:14px}
  .tbtn{flex:1;border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:14px;font-weight:700;font-size:15px}
  .tbtn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
  .tadj{display:flex;gap:8px;justify-content:center;margin-top:12px}
  .tadj button{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:8px 14px;color:var(--muted)}
  .close-x{position:absolute;top:14px;right:16px;font-size:22px;color:var(--muted2);background:none;border:0}

  .infobox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;line-height:1.55;font-size:13.5px;color:var(--muted)}
  .infobox b{color:var(--ink)} .infobox h4{margin:16px 0 6px;color:var(--ink);font-size:14px} .infobox h4:first-child{margin-top:0}
  .reset{margin-top:14px;width:100%;background:transparent;border:1px solid var(--line2);color:var(--muted);border-radius:10px;padding:11px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em}
  .foot{text-align:center;color:var(--muted2);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;margin:26px 0 8px;text-transform:uppercase}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap top">
  <div class="brand">D&#8209;10 <b>TRAINER</b></div>
  <div class="ctx" id="ctx"></div>
</div></header>
<main class="wrap" id="view"></main>
<nav><div class="navin">
  <button class="navbtn" data-nav="today"><span class="ni">&#9678;</span><span class="nl">Today</span></button>
  <button class="navbtn" data-nav="program"><span class="ni">&#9636;</span><span class="nl">Program</span></button>
  <button class="navbtn" data-nav="info"><span class="ni">&#8505;</span><span class="nl">Info</span></button>
</div></nav>
<div class="scrim" id="scrim"><div class="sheet">
  <button class="close-x" onclick="Timer.close()">&times;</button>
  <h3 id="tmr-title">Rest</h3>
  <div class="clock" style="position:relative">
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle class="rbg" cx="100" cy="100" r="88" fill="none" stroke-width="10"/>
      <circle class="rfg" id="tmr-arc" cx="100" cy="100" r="88" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="552.9" stroke-dashoffset="0"/>
    </svg>
    <div class="time" id="tmr-time">0:00</div><div class="phase" id="tmr-phase"></div>
  </div>
  <div class="tadj" id="tmr-adj"><button onclick="Timer.adjust(-30)">&#8722;30s</button><button onclick="Timer.adjust(30)">+30s</button></div>
  <div class="tctrls"><button class="tbtn" onclick="Timer.reset()">Reset</button><button class="tbtn primary" id="tmr-toggle" onclick="Timer.toggle()">Start</button></div>
</div></div>

<script>
/* ===== helpers to keep data compact ===== */
const R=(work,rest,opt)=>({work,rest:rest||'',opt:!!opt});
const S=(name,reps,opt)=>({name:name||'',opt:!!opt,reps});

/* ===================== PROGRAM DATA ===================== */
const ACC=['#38BDF8','#2DD4BF','#A3E635','#FDE047','#FB923C','#F87171','#EF4444'];
const PERIODS=[
  {id:'P1',name:'Intro / GPP',phase:'Accumulation',dates:'Oct 2018',weeks:2,accent:ACC[0]},
  {id:'P2',name:'Hypertrophy 1',phase:'Hypertrophy',dates:'Oct 2018',weeks:4,accent:ACC[1]},
  {id:'P3',name:'Hypertrophy 2',phase:'Hypertrophy',dates:'Nov 2018',weeks:4,accent:ACC[2]},
  {id:'P4',name:'Strength 1',phase:'Strength',dates:'Jan 2019',weeks:3,accent:ACC[3]},
  {id:'P5',name:'Power / Strength',phase:'Power',dates:'Mar 2019',weeks:3,accent:ACC[4]},
  {id:'P6',name:'Realization',phase:'Realization',dates:'May 2019',weeks:3,accent:ACC[5]},
  {id:'P7',name:'Last Kick',phase:'Peak',dates:'Jul 2019',weeks:3,accent:ACC[6]},
];
const HRF=['Max HR','Avg HR','Distance','HR after rest'];
const RUNF=['Time','Max HR','Avg HR','HR after rest'];

/* ---------- P1 ---------- */
const P1={

      {c:'B',name:'Bench Press — strict, pause',note:'Don’t fail — get reps but push a little. Good warm-up (bench is hard after squats).',tempo:'2111',rest:'3–4 min',restSec:210,warmup:'45×10 · 95×10 · 135×5 · 185×1',w:{1:['2','3'],2:['3','2'],3:['4','1']}},
      {c:'C',name:'Pull-Up Test — tempo drop set',note:'5 slow eccentric (no kip), then AMRAP w/ test mechanics.',tempo:'3010 / 1010',rest:'2–4 min',restSec:180,w:{1:['3–4','AMRAP'],2:['3–4','AMRAP'],3:['3–4','AMRAP']}}],
    circuit:{title:'Finisher — 2–3 rounds',items:['Push-up (any)','Face pull / row (any)','ISO split squat — 30s ea leg','Core — rotary (chops, twists, press-outs)']}},
  endur2:{name:'Endurance Events + Row',dow:'Sat',session:'Field Endurance',focus:'Lactic Run + Row',kind:'cond',
    cond:{title:'Lactic Capacity Intervals (Run)',desc:'Run max sustainable effort for the time. Then all weeks: extensive rower 8–20 min.',fields:HRF,
      wk:{1:[S('Series 1',[R('60 sec','90 sec'),R('60 sec','90 sec'),R('60 sec','4 min')]),S('Series 2',[R('60 sec','120 sec'),R('60 sec','120 sec'),R('60 sec','120 sec')],true),S('Extensive Row',[R('8–20 min','')])],
        2:[S('Series 1',[R('75 sec','90 sec'),R('75 sec','90 sec'),R('75 sec','4 min')]),S('Series 2',[R('60 sec','105 sec'),R('60 sec','105 sec'),R('60 sec','105 sec')]),S('Extensive Row',[R('8–20 min','')])],
        3:[S('Series 1',[R('75 sec','90 sec'),R('75 sec','90 sec'),R('75 sec','4 min')]),S('Series 2',[R('75 sec','105 sec'),R('75 sec','105 sec'),R('75 sec','105 sec')]),S('Extensive Row',[R('8–20 min','')])]}}},
 }};

const DATA={P1,P2,P3,P4,P5,P6,P7};

/* ===================== STORAGE (guarded) ===================== */
const Store=(()=>{let ok=false,mem={};try{const k='__d10t';localStorage.setItem(k,'1');localStorage.removeItem(k);ok=true;}catch(e){}
  return{ok,get(k,d){try{if(ok){const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}}catch(e){}return (k in mem)?mem[k]:d;},
    set(k,v){try{if(ok){localStorage.setItem(k,JSON.stringify(v));return;}}catch(e){}mem[k]=v;}};})();
let LOGS=Store.get('d10.logs.v2',{});
let POS=Store.get('d10.pos.v2',{pid:'P1',week:1,day:'lift1'});
let TAB='program';
const saveLogs=()=>Store.set('d10.logs.v2',LOGS);
const savePos=()=>Store.set('d10.pos.v2',POS);
function cell(pid,wk,day){LOGS[pid]=LOGS[pid]||{};LOGS[pid][wk]=LOGS[pid][wk]||{};
  LOGS[pid][wk][day]=LOGS[pid][wk][day]||{ex:{},cond:{},cardio:{},circuit:{}};return LOGS[pid][wk][day];}
function peek(pid,wk,day){return (((LOGS[pid]||{})[wk]||{})[day])||null;}

/* ===================== helpers ===================== */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setAcc(hex){document.documentElement.style.setProperty('--acc',hex);document.querySelector('meta[name=theme-color]').setAttribute('content',hex);}
const P=id=>PERIODS.find(p=>p.id===id);
function wkOf(x,wk){const a=x.w[wk]||x.w[Math.max.apply(0,Object.keys(x.w).map(Number))];return{sets:a[0],reps:a[1]};}
function nRows(x,wk,saved){if(x.track==='metric')return Math.max(3,(saved&&saved.length)||0);
  const g=parseInt(String(wkOf(x,wk).sets).match(/\d+/)?.[0]||'3',10);return Math.max(g,(saved&&saved.length)||0,1);}
function workSecs(w){if(!w)return null;let m=String(w).match(/([\d.]+)\s*min/i);if(m)return Math.round(parseFloat(m[1])*60);
  m=String(w).match(/([\d.]+)\s*sec/i);if(m)return Math.round(parseFloat(m[1]));return null;}
function dayComp(pid,wk,day){const D=DATA[pid]&&DATA[pid].days[day];if(!D||!D.ex)return null;
  const c=peek(pid,wk,day);const lifts=D.ex.filter(x=>x.track!=='metric');if(!lifts.length)return null;
  if(!c)return{done:0,total:lifts.length};let d=0;lifts.forEach(x=>{const s=c.ex[x.c]||[];if(s.some(v=>v&&v.done))d++;});return{done:d,total:lifts.length};}

function renderCtx(){const p=P(POS.pid);const D=DATA[p.id]?DATA[p.id].days[POS.day]:null;
  $('#ctx').innerHTML=`<span class="dot"></span>${esc(p.id)} · WK ${POS.week} · ${esc(D?D.name:'—')}`;}

/* ===================== views ===================== */
function render(){renderCtx();document.querySelectorAll('.navbtn').forEach(b=>b.dataset.on=(b.dataset.nav===TAB)?'1':'0');
  if(TAB==='program')return viewProgram();if(TAB==='info')return viewInfo();return viewDay(POS.pid,POS.week,POS.day);}

function viewProgram(){setAcc(P(POS.pid).accent);
  const bars=()=>{let s='';for(let i=0;i<7;i++){s+=`<i style="height:${16+62*(i/6)}%"></i>`;}return s;};
  $('#view').innerHTML=`
    <div class="eyebrow" style="margin-top:20px">D-10 2019 Prep · Jeff Branham</div>
    <h1>The Program</h1>
    <div class="sub">Seven periods, cool to hot — accumulation through peak. Tap a period to train it.</div>
    <div class="spine">${PERIODS.map(p=>`
      <div class="per" style="--pc:${p.accent}" data-current="${p.id===POS.pid?1:0}" onclick="openPeriod('${p.id}')">
        ${p.id===POS.pid?`<span class="tagcur">Current</span>`:''}
        <div class="rail"></div><div class="bars">${bars()}</div>
        <div class="meta"><div class="pphase">${esc(p.id)} · ${esc(p.phase)}</div>
          <div class="pname">${esc(p.name)}</div><div class="pdates">${esc(p.dates)} · ${p.weeks} weeks</div></div>
        <div class="pgo">&rsaquo;</div></div>`).join('')}</div>
    <div class="foot">Full program · P1–P7 live</div>`;}

function openPeriod(pid){POS.pid=pid;if(POS.week>P(pid).weeks)POS.week=1;
  if(!DATA[pid].days[POS.day])POS.day=DATA[pid].sched.find(s=>s[1])[1];savePos();viewPeriod(pid);}

function viewPeriod(pid){const p=P(pid);setAcc(p.accent);TAB='';document.querySelectorAll('.navbtn').forEach(b=>b.dataset.on='0');renderCtx();
  const wk=POS.week;
  $('#view').innerHTML=`
    <div class="backrow"><button class="back" onclick="go('program')">&lsaquo; Program</button></div>
    <div class="eyebrow" style="margin-top:8px">${esc(p.id)} · ${esc(p.phase)}</div>
    <h1>${esc(p.name)}</h1>
    <div class="sub">${esc(p.dates)} · repeats ${p.weeks} weeks. Prescriptions progress each week.</div>
    <div class="weeks">${Array.from({length:p.weeks},(_,i)=>i+1).map(w=>`<button class="pip" data-on="${w===wk?1:0}" onclick="setWeek(${w})">WK ${w}</button>`).join('')}</div>
    <div class="days">${DATA[pid].sched.map(s=>dayRow(pid,wk,s)).join('')}</div>
    <div class="foot">Tap a session to train &amp; log</div>`;}

function dayRow(pid,wk,s){
  if(!s[1])return `<div class="day off"><span class="dow">${esc(s[0])}</span><div class="dbody"><div class="dname">Off</div></div></div>`;
  const D=DATA[pid].days[s[1]];const kc={lift:'kindLift',cond:'kindCond',cardio:'kindCardio',field:'kindField'}[D.kind]||'kindLift';
  const comp=dayComp(pid,wk,s[1]);let ring='';
  if(comp&&comp.total){const c=2*Math.PI*10,off=c*(1-comp.done/comp.total);
    ring=`<div class="dprog"><svg class="ring" width="26" height="26" viewBox="0 0 26 26"><circle class="bg" cx="13" cy="13" r="10" fill="none" stroke-width="3"/><circle class="fg" cx="13" cy="13" r="10" fill="none" stroke-width="3" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round"/></svg></div>`;}
  const chip={lift:'Lift',cond:'ESD',cardio:'Cardio',field:'Field'}[D.kind]||'Lift';
  return `<div class="day ${kc}" onclick="openDay('${pid}',${wk},'${s[1]}')"><div class="kbar"></div>
    <span class="dow">${esc(s[0])}</span><div class="dbody"><div class="dname">${esc(D.name)}</div>
    <div class="dtype">${esc(s[2].join(' · '))}</div></div>${ring||`<span class="dchip">${chip}</span>`}</div>`;}

function setWeek(w){POS.week=w;savePos();viewPeriod(POS.pid);}
function openDay(pid,wk,day){POS.pid=pid;POS.week=wk;POS.day=day;savePos();viewDay(pid,wk,day);}

function viewDay(pid,wk,day){const p=P(pid);setAcc(p.accent);
  document.querySelectorAll('.navbtn').forEach(b=>b.dataset.on=(b.dataset.nav==='today'&&TAB==='today')?'1':'0');renderCtx();
  const D=DATA[pid]&&DATA[pid].days[day];const v=$('#view');
  if(!D){v.innerHTML=`<div class="infobox" style="margin-top:24px">Not built.</div>`;return;}
  let h=`<div class="backrow"><button class="back" onclick="viewPeriod('${pid}')">&lsaquo; ${esc(p.id)} week</button></div>
    <div class="dayhead"><div class="focus">${esc(D.focus)}</div><h1>${esc(D.name)}</h1><div class="sub">${esc(D.session)} · Week ${wk}</div></div>
    <div class="weeks">${Array.from({length:p.weeks},(_,i)=>i+1).map(w=>`<button class="pip" data-on="${w===wk?1:0}" onclick="openDay('${pid}',${w},'${day}')">WK ${w}</button>`).join('')}</div>`;
  if(D.prep&&D.prep.length){h+=`<details class="prep"><summary>${D.kind==='field'?'Field work':'Warm-up &amp; field work'}<span class="tw">&rsaquo;</span></summary><div class="pbody">${D.prep.map(r=>{
      let val=(r[1]&&typeof r[1]==='object')?(r[1][wk]||r[1][Object.keys(r[1]).slice(-1)[0]]):(r[1]||'');
      return `<div class="prow"><div class="pl">${esc(r[0])}</div>${val?`<div class="pv">${esc(val)}</div>`:''}</div>`;}).join('')}</div></details>`;}
  if(D.kind==='cardio'||D.kind==='field'){h+=cardioCard(pid,wk,day,D);}
  if(D.cond){h+=condCard(pid,wk,day,D.cond);}
  if(D.ex)D.ex.forEach(x=>{h+=exCard(pid,wk,day,x);});
  if(D.circuit)h+=circuitCard(pid,wk,day,D.circuit);
  if(D.outro)h+=`<div class="note-lite">${esc(D.outro)}</div>`;
  h+=`<div class="foot">${esc(p.name)} · ${esc(D.name)}</div>`;
  v.innerHTML=h;}

function exCard(pid,wk,day,x){const rx=wkOf(x,wk);const jump=x.track==='metric';
  const badge=jump?'jump':(/[0-9]$/.test(x.c)?'alt':'');
  let h=`<div class="ex"><div class="xh"><div class="badge ${badge}">${esc(x.c)}</div>
    <div class="xt"><div class="xname">${esc(x.name)}</div>${x.note?`<div class="xnote">${esc(x.note)}</div>`:''}</div></div>
    <div class="rx"><div class="rxcell"><div class="k">Sets</div><div class="v">${esc(rx.sets)}</div></div>
      <div class="rxcell big"><div class="k">${jump?'Reps':'Reps'}</div><div class="v">${esc(rx.reps)}</div></div>
      ${x.tempo?`<div class="rxcell"><div class="k">Tempo</div><div class="v">${esc(x.tempo)}</div></div>`:''}
      ${x.restSec?`<button class="rest-btn" onclick="Timer.rest(${x.restSec},'${esc(x.name)}')"><span>&#9203;</span> <b>${esc(x.rest||'rest')}</b></button>`:(x.rest?`<div class="rxcell"><div class="k">Rest</div><div class="v" style="font-size:12px">${esc(x.rest)}</div></div>`:'')}
    </div>`;
  if(x.warmup)h+=`<div class="rx" style="padding-top:0"><div class="rxcell" style="flex:1"><div class="k">Warm-up</div><div class="v" style="font-size:12.5px">${esc(x.warmup)}</div></div></div>`;
  if(x.xc)h+=`<div class="xc">&#43; <b>extra credit</b> · ${esc(x.xc)} reps (optional)</div>`;
  const c=cell(pid,wk,day);const saved=c.ex[x.c]||[];const rows=nRows(x,wk,saved);
  const prev=peek(pid,wk-1,day);const pset=prev?((prev.ex||{})[x.c]||[]):[];
  h+=`<div class="sets">`;
  if(jump){h+=`<div class="setrow metric head"><span class="sh-lbl">Set</span><span>${esc(x.metric||'Result')}</span><span>&#10003;</span></div>`;
    for(let i=0;i<rows;i++)h+=metricRow(pid,wk,day,x.c,i,saved[i]||{},pset[i]);}
  else{h+=`<div class="setrow head"><span class="sh-lbl">Set</span><span>Weight</span><span>Reps</span><span>&#10003;</span></div>`;
    for(let i=0;i<rows;i++)h+=setRow(pid,wk,day,x.c,i,saved[i]||{},pset[i]);}
  h+=`</div><button class="addset" onclick="addSet('${pid}',${wk},'${day}','${x.c}')">+ add set</button></div>`;
  return h;}

function setRow(pid,wk,day,code,i,val,prev){const done=val.done?'done':'';
  const ghost=(prev&&(prev.w||prev.r))?`<div class="lastwk">last wk · <b>${esc(prev.w||'–')}</b> × <b>${esc(prev.r||'–')}</b></div>`:'';
  return `<div class="setrow ${done}" id="row-${code}-${i}"><div class="setno">${i+1}</div>
    <input inputmode="decimal" placeholder="lb" value="${esc(val.w||'')}" oninput="upd('${pid}',${wk},'${day}','${code}',${i},'w',this.value)">
    <input inputmode="numeric" placeholder="reps" value="${esc(val.r||'')}" oninput="upd('${pid}',${wk},'${day}','${code}',${i},'r',this.value)">
    <button class="chk" onclick="toggleDone('${pid}',${wk},'${day}','${code}',${i})">&#10003;</button>${ghost}</div>`;}

function metricRow(pid,wk,day,code,i,val,prev){const done=val.done?'done':'';
  const ghost=(prev&&prev.m)?`<div class="lastwk" style="grid-column:2/3">last wk · <b>${esc(prev.m)}</b></div>`:'';
  return `<div class="setrow metric ${done}" id="row-${code}-${i}"><div class="setno">${i+1}</div>
    <input inputmode="decimal" placeholder="—" value="${esc(val.m||'')}" oninput="upd('${pid}',${wk},'${day}','${code}',${i},'m',this.value)">
    <button class="chk" onclick="toggleDone('${pid}',${wk},'${day}','${code}',${i})">&#10003;</button>${ghost}</div>`;}

function upd(pid,wk,day,code,i,f,v){const c=cell(pid,wk,day);c.ex[code]=c.ex[code]||[];c.ex[code][i]=c.ex[code][i]||{};c.ex[code][i][f]=v;saveLogs();}
function toggleDone(pid,wk,day,code,i){const c=cell(pid,wk,day);c.ex[code]=c.ex[code]||[];c.ex[code][i]=c.ex[code][i]||{};
  c.ex[code][i].done=!c.ex[code][i].done;saveLogs();const r=$('#row-'+code+'-'+i);if(r)r.classList.toggle('done',c.ex[code][i].done);buzz(8);}
function addSet(pid,wk,day,code){const c=cell(pid,wk,day);c.ex[code]=c.ex[code]||[];c.ex[code].push({});saveLogs();viewDay(pid,wk,day);}

function condCard(pid,wk,day,C){const series=C.wk[wk]||C.wk[1];
  let h=`<div class="cond"><div class="ch"><div class="ct">${esc(C.title)}</div><div class="cs">${esc(C.desc)}</div></div>`;
  if(C.timer)h+=`<button class="interval-btn" onclick="Timer.interval(${C.timer.work},${C.timer.rest},${C.timer.rounds||countReps(series)},'ESD')">&#9654; ${esc(C.timer.label)}</button>`;
  let idx=0;
  series.forEach(S0=>{if(S0.name||S0.opt)h+=`<div class="series-h">${esc(S0.name||'Series')}${S0.opt?` <span class="o">· optional</span>`:''}</div>`;
    S0.reps.forEach(r=>{h+=condRep(pid,wk,day,C,r,idx++);});});
  h+=`</div>`;return h;}
function countReps(series){let n=0;series.forEach(s=>n+=s.reps.length);return n;}

function condRep(pid,wk,day,C,r,i){const c=cell(pid,wk,day);const saved=c.cond[i]||{};const ws=workSecs(r.work);
  return `<div class="reps" style="padding-top:0"><div class="rep">
    <div class="rhd"><div class="rl">${esc(r.work)}${r.rest?` <small>rest ${esc(r.rest)}</small>`:''}</div>
      ${r.opt?`<div class="rt">optional</div>`:''}
      ${ws?`<button class="rtimer" onclick="Timer.work(${ws},'${esc(r.work)}')">&#9654; go</button>`:''}</div>
    <div class="fields">${C.fields.map(f=>`<div class="fld"><label>${esc(f)}</label><input value="${esc(saved[f]||'')}" oninput="updCond('${pid}',${wk},'${day}',${i},'${esc(f)}',this.value)"></div>`).join('')}</div>
  </div></div>`;}
function updCond(pid,wk,day,i,f,v){const c=cell(pid,wk,day);c.cond[i]=c.cond[i]||{};c.cond[i][f]=v;saveLogs();}

function cardioCard(pid,wk,day,D){const c=cell(pid,wk,day);const f=D.logf||['Notes'];
  let h=`<div class="cond"><div class="ch"><div class="ct">${esc(D.name)}</div><div class="cs">${esc(D.desc||'')}</div></div>`;
  if(D.timer)h+=`<button class="interval-btn" onclick="Timer.interval(${D.timer.work},${D.timer.rest},${D.timer.rounds||1},'${esc(D.timer.label)}')">&#9654; ${esc(D.timer.label)}</button>`;
  h+=`<div class="reps"><div class="rep"><div class="rhd"><div class="rl">Log</div></div><div class="fields">
    ${f.map(lbl=>`<div class="fld"><label>${esc(lbl)}</label><input value="${esc((c.cardio||{})[lbl]||'')}" oninput="updCardio('${pid}',${wk},'${day}','${esc(lbl)}',this.value)"></div>`).join('')}
  </div></div></div></div>`;return h;}
function updCardio(pid,wk,day,lbl,v){const c=cell(pid,wk,day);c.cardio=c.cardio||{};c.cardio[lbl]=v;saveLogs();}

function circuitCard(pid,wk,day,C){const c=cell(pid,wk,day);const r=(c.circuit&&c.circuit.rounds)||0;
  return `<div class="ex"><div class="xh"><div class="badge alt">&#8635;</div><div class="xt"><div class="xname">${esc(C.title)}</div></div></div>
    <div class="circuit">${C.items.map((it,i)=>`<div class="citem"><span class="cn">${i+1}</span><span>${esc(it)}</span></div>`).join('')}
    <div class="rounds">Rounds done<div class="stepper"><button onclick="circR('${pid}',${wk},'${day}',-1)">&minus;</button><div class="val" id="circ-${day}">${r}</div><button onclick="circR('${pid}',${wk},'${day}',1)">+</button></div></div></div></div>`;}
function circR(pid,wk,day,d){const c=cell(pid,wk,day);c.circuit=c.circuit||{rounds:0};c.circuit.rounds=Math.max(0,(c.circuit.rounds||0)+d);saveLogs();
  const el=$('#circ-'+day);if(el)el.textContent=c.circuit.rounds;buzz(6);}

function viewInfo(){setAcc(P(POS.pid).accent);
  $('#view').innerHTML=`<div class="eyebrow" style="margin-top:20px">How this works</div><h1>Info</h1>
    <div class="infobox">
      <h4>Add to your Home Screen</h4>In Safari, tap <b>Share &rsaquo; Add to Home Screen</b>. Opens full-screen and works offline.
      <h4>Your log stays on your phone</h4>Everything saves to <b>this device</b> only. Share the same link with friends — each person keeps their own private log, no accounts.
      <h4>Weekly progression</h4>Prescriptions change each week — use the <b>WK</b> pips. Last week shows as a faint <b>“last wk”</b> line under each set.
      <h4>Jumps &amp; extra credit</h4>Jump / vertec work logs a single number per set (height or distance). <b>Extra credit</b> reps are optional bonus work, shown in amber.
      <h4>Timers</h4>Tap the <b>rest</b> pill on any lift, or <b>go</b> on a conditioning rep, for a countdown. Both buzz at zero.
    </div>
    <button class="reset" onclick="resetAll()">Erase my saved log on this device</button>
    <div class="foot">D-10 2019 Prep · P1–P7</div>`;}
function resetAll(){if(!confirm('Erase all logged sets and progress on this device?'))return;LOGS={};saveLogs();go('program');}

function go(tab){TAB=tab;if(tab==='today'){viewDay(POS.pid,POS.week,POS.day);document.querySelectorAll('.navbtn').forEach(b=>b.dataset.on=(b.dataset.nav==='today')?'1':'0');return;}render();}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));

/* ===================== feedback + timer ===================== */
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
let AC=null;function beep(f=900,d=.16){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.4,AC.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}catch(e){}}

const Timer=(()=>{const CIRC=2*Math.PI*88;let mode='rest',total=90,left=90,running=false,tick=null;
  let iv={work:0,rest:0,rounds:1,r:0,phase:'work'};const el={};
  function c(){el.s=$('#scrim');el.t=$('#tmr-time');el.a=$('#tmr-arc');el.p=$('#tmr-phase');el.h=$('#tmr-title');el.g=$('#tmr-toggle');el.adj=$('#tmr-adj');}
  function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
  function draw(){el.t.textContent=fmt(left);el.a.setAttribute('stroke-dashoffset',(CIRC*(1-(total?left/total:0))).toFixed(1));}
  function rest(sec,name){c();mode='rest';total=sec;left=sec;el.h.textContent='Rest · '+name;el.p.textContent='';el.adj.style.display='';draw();open();start();}
  function work(sec,label){c();mode='rest';total=sec;left=sec;el.h.textContent='Work · '+label;el.p.textContent='';el.adj.style.display='';draw();open();start();}
  function interval(w,rst,rounds,label){c();mode='interval';iv={work:w,rest:rst,rounds:rounds,r:1,phase:'work'};
    el.h.textContent=label+' · interval';el.adj.style.display='none';total=w;left=w;el.p.textContent='Round 1 of '+rounds+' · work';draw();open();start();}
  function open(){el.s.dataset.open='1';}function close(){stop();el.s.dataset.open='0';}
  function start(){running=true;el.g.textContent='Pause';clearInterval(tick);let last=Date.now();
    tick=setInterval(()=>{const n=Date.now();left-=(n-last)/1000;last=n;if(left<=0)zero();draw();},200);}
  function stop(){running=false;clearInterval(tick);if(el.g)el.g.textContent='Start';}
  function toggle(){running?stop():start();}function reset(){left=total;draw();stop();}
  function adjust(d){total=Math.max(5,total+d);left=Math.max(1,left+d);draw();}
  function zero(){beep(980,.18);buzz([20,60,20]);
    if(mode==='rest'){stop();left=0;draw();setTimeout(close,500);return;}
    if(iv.phase==='work'&&iv.rest>0){iv.phase='rest';total=iv.rest;left=iv.rest;el.p.textContent='Round '+iv.r+' of '+iv.rounds+' · rest';return;}
    if(iv.r>=iv.rounds){stop();beep(660,.3);el.p.textContent='Done';left=0;draw();setTimeout(close,700);return;}
    iv.r++;iv.phase='work';total=iv.work;left=iv.work;el.p.textContent='Round '+iv.r+' of '+iv.rounds+' · work';}
  return{rest,work,interval,close,toggle,reset,adjust};})();

(function(){const mani={name:'D-10 Trainer',short_name:'D-10',start_url:'.',display:'standalone',background_color:'#0B0F14',theme_color:'#0B0F14'};
  try{const b=new Blob([JSON.stringify(mani)],{type:'application/manifest+json'});const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(b);document.head.appendChild(l);}catch(e){}})();

render();
